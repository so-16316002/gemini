<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荻田の大冒険</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #05050a;
      color: #e0e0e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* タイトル画面 */
    #title-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }
    .title-logo {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff007f, 0 0 30px #ff007f;
      margin-bottom: 40px;
      animation: dropDown 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dropDown {
      0% { transform: translateY(-200px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .press-start {
      font-size: 1.2rem;
      color: #00f3ff;
      text-shadow: 0 0 8px #00f3ff;
      margin-bottom: 30px;
      letter-spacing: 2px;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .btn-neon {
      background: transparent;
      color: #00ff66;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 40px;
      border: 2px solid #00ff66;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff66, inset 0 0 10px #00ff66;
      text-shadow: 0 0 5px #00ff66;
      transition: all 0.2s ease;
    }
    .btn-neon:hover {
      background: #00ff66;
      color: #05050a;
      box-shadow: 0 0 20px #00ff66, inset 0 0 20px #00ff66;
    }

    /* 本編画面 */
    #game-container {
      display: none;
      width: 100%;
      max-width: 600px;
      background-color: #16213e;
      border: 3px solid #0f3460;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #0f3460;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .status-val { font-weight: bold; color: #e94560; }
    #screen {
      background-color: #0f3460;
      border-radius: 8px;
      padding: 15px;
      min-height: 140px;
      margin-bottom: 15px;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .game-btn {
      background-color: #e94560;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .game-btn:hover { background-color: #ff6b81; }
  </style>
</head>
<body>

<!-- タイトル画面 -->
<div id="title-screen">
  <div class="title-logo">荻田の大冒険</div>
  <div class="press-start">- PRESS START -</div>
  <button class="btn-neon" id="start-btn">最初から</button>
</div>

<!-- 本編画面 -->
<div id="game-container">
  <div class="header">
    <div>主人公: <strong>荻田</strong></div>
    <div>HP: <span id="hp" class="status-val">100</span> / 100</div>
    <div>現在地: <span id="location" style="color:#00f3ff; font-weight:bold;">はじまりの街</span></div>
  </div>

  <div id="screen">読み込み中...</div>
  <div id="choices" class="choices-grid"></div>
</div>

<script>
  let audioCtx = null;
  let bgmInterval = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playSe() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  function startBgm() {
    if (bgmInterval) return;
    initAudio();
    const notes = [261.63, 329.63, 392.00, 523.25];
    let step = 0;
    bgmInterval = setInterval(() => {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
      step++;
    }, 300);
  }

  window.addEventListener('click', () => { startBgm(); }, { once: true });

  // プレイヤー状態
  const state = {
    hp: 100,
    maxHp: 100,
    locationName: "はじまりの街",
    enemyHp: 0,
    enemyName: ""
  };

  function updateStatus() {
    document.getElementById('hp').textContent = state.hp;
    document.getElementById('location').textContent = state.locationName;
  }

  function render(text, choices) {
    document.getElementById('screen').innerHTML = text;
    const choicesContainer = document.getElementById('choices');
    choicesContainer.innerHTML = '';
    
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'game-btn';
      btn.textContent = c.text;
      btn.onclick = () => {
        playSe();
        c.action();
      };
      choicesContainer.appendChild(btn);
    });
    updateStatus();
  }

  // --- エリア移動システム ---

  // エリア1: はじまりの街
  function areaStartTown() {
    state.locationName = "はじまりの街";
    render(
      "【はじまりの街】<br>荻田の旅の出発点。穏やかな風が吹いている。",
      [
        { text: "宿屋で休む (HP回復)", action: restAtInn },
        { text: "「暗い森」へ移動する", action: areaDarkForest },
        { text: "「隣の港町」へ移動する", action: areaPortTown }
      ]
    );
  }

  function restAtInn() {
    state.hp = state.maxHp;
    render("宿屋で一晩過ごした。HPが全回復した！", [
      { text: "街に戻る", action: areaStartTown }
    ]);
  }

  // エリア2: 暗い森（バトルが発生するエリア）
  function areaDarkForest() {
    state.locationName = "暗い森";
    render(
      "【暗い森】<br>木々がうっそうと茂り、危険な雰囲気が漂っている…",
      [
        { text: "森の奥を探検する (バトル)", action: () => startBattle("森の野良犬", 35) },
        { text: "「はじまりの街」へ戻る", action: areaStartTown },
        { text: "「危険な山道」へ進む", action: areaMountain }
      ]
    );
  }

  // エリア3: 隣の港町
  function areaPortTown() {
    state.locationName = "隣の港町";
    render(
      "【隣の港町】<br>海風が心地よい賑やかな街。船がたくさん停まっている。",
      [
        { text: "「はじまりの街」へ戻る", action: areaStartTown },
        { text: "港を探索する (バトル)", action: () => startBattle("海賊の手下", 50) }
      ]
    );
  }

  // エリア4: 危険な山道
  function areaMountain() {
    state.locationName = "危険な山道";
    render(
      "【危険な山道】<br>足場が悪い山道。強力な魔物が潜んでいそうだ。",
      [
        { text: "「暗い森」へ戻る", action: areaDarkForest },
        { text: "頂上を目指す (ボスバトル)", action: () => startBattle("山の主（大グマ）", 80) }
      ]
    );
  }

  // --- バトルシステム ---
  function startBattle(enemyName, enemyHp) {
    state.enemyName = enemyName;
    state.enemyHp = enemyHp;
    battleTurn(`危険な敵「${enemyName}」が現れた！`);
  }

  function battleTurn(message) {
    if (state.enemyHp <= 0) {
      render(`【勝利！】<br>${state.enemyName}を倒した！`, [
        { text: "探索を続ける", action: () => {
          if (state.locationName === "暗い森") areaDarkForest();
          else if (state.locationName === "隣の港町") areaPortTown();
          else if (state.locationName === "危険な山道") areaMountain();
        }}
      ]);
      return;
    }

    if (state.hp <= 0) {
      render("【ゲームオーバー】<br>荻田は力尽きてしまった…", [
        { text: "タイトルに戻る", action: () => location.reload() }
      ]);
      return;
    }

    render(
      `【バトル】${message}<br><br>相手: ${state.enemyName} (HP: ${state.enemyHp})`,
      [
        { text: "攻撃", action: () => playerAttack("punch") },
        { text: "必殺技", action: () => playerAttack("special") },
        { text: "逃げる", action: () => {
          if (state.locationName === "暗い森") areaDarkForest();
          else if (state.locationName === "隣の港町") areaPortTown();
          else if (state.locationName === "危険な山道") areaMountain();
        }}
      ]
    );
  }

  function playerAttack(type) {
    let damage = type === "special" ? 25 : 15;
    let msg = `荻田の${type === "special" ? "必殺技" : "攻撃"}！ ${damage}のダメージ！`;
    state.enemyHp -= damage;

    if (state.enemyHp > 0) {
      const enemyDamage = Math.floor(Math.random() * 8) + 6;
      state.hp -= enemyDamage;
      msg += `<br>相手の反撃！荻田は${enemyDamage}のダメージを受けた！`;
    }

    battleTurn(msg);
  }

  // スタート処理
  document.getElementById('start-btn').addEventListener('click', () => {
    playSe();
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    areaStartTown();
  });
</script>

</body>
</html>
