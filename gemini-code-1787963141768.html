<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荻田の大冒険</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #05050a;
      color: #e0e0e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* --- タイトル画面スタイル --- */
    #title-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }

    .title-logo {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ff007f,
        0 0 30px #ff007f,
        0 0 40px #ff007f;
      margin-bottom: 40px;
      animation: dropDown 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes dropDown {
      0% { transform: translateY(-200px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .press-start {
      font-size: 1.2rem;
      color: #00f3ff;
      text-shadow: 0 0 8px #00f3ff;
      margin-bottom: 30px;
      letter-spacing: 2px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .btn-neon {
      background: transparent;
      color: #00ff66;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 40px;
      border: 2px solid #00ff66;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff66, inset 0 0 10px #00ff66;
      text-shadow: 0 0 5px #00ff66;
      transition: all 0.2s ease;
    }

    .btn-neon:hover {
      background: #00ff66;
      color: #05050a;
      box-shadow: 0 0 20px #00ff66, inset 0 0 20px #00ff66;
    }

    /* --- 本編ゲーム画面スタイル --- */
    #game-container {
      display: none; /* 最初は非表示 */
      width: 100%;
      max-width: 600px;
      background-color: #16213e;
      border: 3px solid #0f3460;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #0f3460;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .status-val { font-weight: bold; color: #e94560; }
    #screen {
      background-color: #0f3460;
      border-radius: 8px;
      padding: 15px;
      min-height: 140px;
      margin-bottom: 15px;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .game-btn {
      background-color: #e94560;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .game-btn:hover { background-color: #ff6b81; }
  </style>
</head>
<body>

<!-- タイトル画面 -->
<div id="title-screen">
  <div class="title-logo">荻田の大冒険</div>
  <div class="press-start">- PRESS START -</div>
  <button class="btn-neon" id="start-btn">最初から</button>
</div>

<!-- 本編ゲーム画面 -->
<div id="game-container">
  <div class="header">
    <div>主人公: <strong>荻田</strong></div>
    <div>HP: <span id="hp" class="status-val">100</span> / 100</div>
    <div>所持金: <span id="gold" class="status-val">500</span> 円</div>
  </div>

  <div id="screen">読み込み中...</div>
  <div id="choices" class="choices-grid"></div>
</div>

<script>
  // --- オーディオ制御（Web Audio API） ---
  let audioCtx = null;
  let bgmInterval = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // ピコッ音
  function playSe() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  // BGM
  function startBgm() {
    if (bgmInterval) return;
    initAudio();
    const notes = [261.63, 329.63, 392.00, 523.25];
    let step = 0;
    bgmInterval = setInterval(() => {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
      step++;
    }, 300);
  }

  window.addEventListener('click', () => { startBgm(); }, { once: true });

  // --- ゲーム本編ロジック ---
  const state = {
    hp: 100,
    maxHp: 100,
    gold: 500,
    enemyHp: 0,
    enemyName: ""
  };

  function updateStatus() {
    document.getElementById('hp').textContent = state.hp;
    document.getElementById('gold').textContent = state.gold;
  }

  function render(text, choices) {
    document.getElementById('screen').innerHTML = text;
    const choicesContainer = document.getElementById('choices');
    choicesContainer.innerHTML = '';
    
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'game-btn';
      btn.textContent = c.text;
      btn.onclick = () => {
        playSe();
        c.action();
      };
      choicesContainer.appendChild(btn);
    });
    updateStatus();
  }

  function sceneTown() {
    render(
      "【普通の街・駅前】<br>荻田はいつもの街の駅前にいる。どこへ行こうか？",
      [
        { text: "コンビニに行く", action: sceneConvenienceStore },
        { text: "裏路地を探検する", action: startBattle },
        { text: "ベンチで休む (HP回復)", action: rest },
        { text: "街を散策する", action: sceneWalk }
      ]
    );
  }

  function sceneWalk() {
    render(
      "【商店街】<br>商店街を歩いていると、美味しそうな匂いがしてきた。平和な一日だ。",
      [{ text: "駅前に戻る", action: sceneTown }]
    );
  }

  function sceneConvenienceStore() {
    render(
      "【コンビニ】<br>店員「いらっしゃいませ！」エナジードリンク（200円）が売っている。",
      [
        { text: "ドリンクを買う (HP50回復)", action: buyDrink },
        { text: "店を出る", action: sceneTown }
      ]
    );
  }

  function buyDrink() {
    if (state.gold >= 200) {
      state.gold -= 200;
      state.hp = Math.min(state.maxHp, state.hp + 50);
      render("荻田はエナジードリンクを飲んだ！HPが50回復した！", [
        { text: "戻る", action: sceneConvenienceStore }
      ]);
    } else {
      render("お金が足りないようだ…", [
        { text: "戻る", action: sceneConvenienceStore }
      ]);
    }
  }

  function rest() {
    state.hp = state.maxHp;
    render("荻田はベンチで少し眠った。HPが全回復した！", [
      { text: "起きる", action: sceneTown }
    ]);
  }

  function startBattle() {
    state.enemyName = "野良カラス";
    state.enemyHp = 40;
    battleTurn("凶暴な「野良カラス」が襲いかかってきた！");
  }

  function battleTurn(message) {
    if (state.enemyHp <= 0) {
      state.gold += 300;
      render(`【勝利！】<br>${state.enemyName}を撃退した！<br>300円を手に入れた！`, [
        { text: "街に戻る", action: sceneTown }
      ]);
      return;
    }

    if (state.hp <= 0) {
      render("【ゲームオーバー】<br>荻田は倒れてしまった…", [
        { text: "タイトルへ戻る", action: () => location.reload() }
      ]);
      return;
    }

    render(
      `【バトル】${message}<br><br>相手: ${state.enemyName} (HP: ${state.enemyHp})`,
      [
        { text: "攻撃（パンチ）", action: () => playerAttack("punch") },
        { text: "荻田のキック", action: () => playerAttack("kick") },
        { text: "説得してみる", action: () => playerAttack("talk") },
        { text: "逃げる", action: sceneTown }
      ]
    );
  }

  function playerAttack(type) {
    let damage = 0;
    let msg = "";

    if (type === "punch") {
      damage = 12;
      msg = "荻田のジャブが命中！12のダメージ！";
    } else if (type === "kick") {
      damage = 20;
      msg = "荻田の渾身のキック！20のダメージ！";
    } else if (type === "talk") {
      damage = 5;
      msg = "荻田は熱く語りかけた！相手は少し困惑して5のダメージ！";
    }

    state.enemyHp -= damage;

    if (state.enemyHp > 0) {
      const enemyDamage = Math.floor(Math.random() * 10) + 5;
      state.hp -= enemyDamage;
      msg += `<br>野良カラスのつつく攻撃！荻田は${enemyDamage}のダメージを受けた！`;
    }

    battleTurn(msg);
  }

  // --- スタートボタンの処理 ---
  document.getElementById('start-btn').addEventListener('click', () => {
    playSe();
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    sceneTown();
  });
</script>

</body>
</html>
