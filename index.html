<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荻田の大冒険</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #05050a;
      color: #e0e0e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 480px;
      background-color: #16213e;
      border: 3px solid #0f3460;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    
    #map-canvas {
      background-color: #388e3c;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      display: block;
      margin: 0 auto 10px auto;
      image-rendering: pixelated;
    }

    #dialog {
      background-color: #0f3460;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      padding: 10px 15px;
      min-height: 70px;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    #battle-overlay {
      display: none;
      position: absolute;
      top: 50px;
      left: 15px;
      right: 15px;
      height: 384px;
      background-color: #05050a;
      border: 3px solid #ff0055;
      border-radius: 8px;
      padding: 10px;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    #battle-canvas {
      width: 100%;
      height: 200px;
      background: #000;
      border-radius: 6px;
      border: 1px solid #333;
    }

    .battle-ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101828;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #00f3ff;
      font-size: 0.8rem;
    }

    .battle-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }
    .battle-btn {
      padding: 8px;
      background: #1f4068;
      color: #fff;
      border: 2px solid #00f3ff;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .battle-btn:active { background: #00f3ff; color: #000; }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-width: 180px;
      margin: 0 auto;
    }
    .ctrl-btn {
      background: #1f4068;
      color: #fff;
      border: 1px solid #00f3ff;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #00f3ff; color: #000; }
    .empty { visibility: hidden; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <div>荻田 Lv.<span id="player-lv">1</span> (HP: <span id="player-hp">30</span>/30)</div>
    <div>所持金: <span id="gold-val" style="color:#ffd700; font-weight:bold;">0</span> G</div>
  </div>

  <canvas id="map-canvas" width="384" height="384"></canvas>

  <div id="battle-overlay">
    <canvas id="battle-canvas" width="420" height="200"></canvas>

    <div class="battle-ui">
      <div><span id="enemy-name">敵</span> <span style="color:#ffcc00;">Lv.<span id="enemy-lv">1</span></span></div>
      <div>荻田 HP: <span id="b-hero-hp">30</span>/<span id="b-hero-maxhp">30</span></div>
    </div>

    <div id="battle-msg" style="text-align:center; font-size: 0.8rem; color:#ffd700; min-height: 1.2em;"></div>

    <div class="battle-btns">
      <button class="battle-btn" onclick="cmdFight()">⚔️ 戦う</button>
      <button class="battle-btn" onclick="cmdDefend()">🛡️ 防御</button>
      <button class="battle-btn" onclick="cmdItem()">🎒 持ち物</button>
      <button class="battle-btn" onclick="cmdRun()">🏃 逃げる</button>
    </div>
  </div>

  <div id="dialog">【始まりの地】<br>中央下からスタート！敵にぶつかって戦闘を開始しよう。</div>

  <div class="controls">
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, -1)">▲</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(-1, 0)">◄</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(1, 0)">►</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, 1)">▼</button>
    <div class="empty"></div>
  </div>
</div>
  
 <script>
  // 画像の読み込み処理（キャッシュ対策付き）
  const images = {};

  function loadImage(key, src) {
    const img = new Image();
    // キャッシュによる読み込み失敗を防ぐタイムスタンプ
    img.src = src + '?v=' + new Date().getTime();
    images[key] = { img: img, loaded: false, error: false };

    img.onload = () => {
      images[key].loaded = true;
      drawMap();
    };

    img.onerror = () => {
      console.error('画像の読み込みに失敗しました:', src);
      images[key].error = true;
      drawMap();
    };
  }

  // hero.jpg を読み込み
  loadImage('hero', 'hero.jpg');

  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');
  const bCanvas = document.getElementById('battle-canvas');
  const bCtx = bCanvas.getContext('2d');
  const tileSize = 32;

  const mapWidth = 30;
  const mapHeight = 30;
  const viewGrid = 12;

  const player = {
    x: 15, y: 26,
    lv: 1, hp: 30, maxHp: 30, atk: 8,
    gold: 0, exp: 0,
    potion: 2
  };

  let currentEnemy = null;
  let currentEnemyPos = null;
  let isTurnProcessing = false;

  let heroAnimOffset = { x: 0, y: 0 };
  let animFrameId = null;

  const state = {
    hasMap: false,
    visitedHome: false,
    defeatedKatsuta: false
  };

  const map = Array.from({ length: mapHeight }, (_, r) =>
    Array.from({ length: mapWidth }, (_, c) => {
      if (r === 0 || r === mapHeight - 1 || c === 0 || c === mapWidth - 1) return 1;
      return 0;
    })
  );

  map[26][17] = 2;
  map[20][5] = 3;
  map[20][25] = 4;
  map[3][15] = 5;

  map[24][13] = 6;
  map[22][16] = 6;
  map[25][10] = 6;
  map[18][8] = 6;

  function updateStatusUI() {
    document.getElementById('player-lv').textContent = player.lv;
    document.getElementById('player-hp').textContent = player.hp;
    document.getElementById('gold-val').textContent = player.gold;

    document.getElementById('b-hero-hp').textContent = player.hp;
    document.getElementById('b-hero-maxhp').textContent = player.maxHp;
  }

  function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = player.x - Math.floor(viewGrid / 2);
    const offsetY = player.y - Math.floor(viewGrid / 2);

    for (let r = 0; r < viewGrid; r++) {
      for (let c = 0; c < viewGrid; c++) {
        const mapX = offsetX + c;
        const mapY = offsetY + r;
        const screenX = c * tileSize;
        const screenY = r * tileSize;

        if (mapX < 0 || mapX >= mapWidth || mapY < 0 || mapY >= mapHeight) {
          ctx.fillStyle = '#05050a';
          ctx.fillRect(screenX, screenY, tileSize, tileSize);
          continue;
        }

        const type = map[mapY][mapX];

        ctx.fillStyle = '#388e3c';
        ctx.fillRect(screenX, screenY, tileSize, tileSize);

        if (type === 1) ctx.fillStyle = '#1b5e20';
        else if (type === 2) ctx.fillStyle = '#ffb74d';
        else if (type === 3) ctx.fillStyle = '#e53935';
        else if (type === 4) ctx.fillStyle = '#ba68c8';
        else if (type === 5) ctx.fillStyle = '#ff1744';
        else if (type === 6) ctx.fillStyle = '#4caf50';

        if (type !== 0) {
          ctx.fillRect(screenX + 4, screenY + 4, tileSize - 8, tileSize - 8);
        }
      }
    }

    const centerPos = Math.floor(viewGrid / 2) * tileSize;
    const pSize = tileSize - 4;
    const px = centerPos + tileSize / 2;
    const py = centerPos + tileSize / 2;

    const heroData = images['hero'];

    if (heroData && heroData.loaded && !heroData.error) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(px, py, pSize / 2, 0, Math.PI * 2, true);
      ctx.closePath();
      ctx.clip();

      ctx.drawImage(heroData.img, px - pSize / 2, py - pSize / 2, pSize, pSize);

      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(centerPos + 6, centerPos + 6, tileSize - 12, tileSize - 12);
    }
  }

  function movePlayer(dx, dy) {
    if (currentEnemy) return;

    const newX = player.x + dx;
    const newY = player.y + dy;
    const target = map[newY][newX];

    if (target === 0) {
      player.x = newX;
      player.y = newY;
    } else {
      triggerEvent(target, newX, newY);
    }
    drawMap();
  }

  function triggerEvent(type, x, y) {
    const dialog = document.getElementById('dialog');

    if (type === 2) {
      dialog.innerHTML = "<strong>村人:</strong><br>「敵を倒してレベルを上げよう！」";
    } else if (type === 6) {
      startBattle("野良スライム", 1, 15, 4, 20, 15, "#4caf50", x, y);
    } else if (type === 3) {
      startBattle("地図持ちガード", 3, 40, 8, 100, 50, "#e53935", x, y, true);
    } else if (type === 4) {
      if (!state.hasMap) {
        dialog.innerHTML = "<strong>システム:</strong><br>地図がないため、まだ進めない…";
      } else {
        state.visitedHome = true;
        dialog.innerHTML = "<span style='color:#ba68c8;'>【故郷の思い出】</span><br>木刀を発見した！『勝田は最北の地で待つ』";
      }
    } else if (type === 5) {
      if (!state.visitedHome) {
        dialog.innerHTML = "<strong>勝田:</strong><br>「己の原点を見つめ直してこい。」";
      } else {
        startBattle("師匠・勝田", 5, 80, 12, 0, 200, "#ff1744", x, y, false, true);
      }
    }
  }

  function render3DBattle() {
    bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);

    const grad = bCtx.createLinearGradient(0, 0, 0, bCanvas.height);
    grad.addColorStop(0, '#0f172a');
    grad.addColorStop(0.5, '#1e293b');
    grad.addColorStop(1, '#0f172a');
    bCtx.fillStyle = grad;
    bCtx.fillRect(0, 0, bCanvas.width, bCanvas.height);

    bCtx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
    bCtx.lineWidth = 1;
    const vanishY = 70;
    for (let i = -5; i <= 5; i++) {
      bCtx.beginPath();
      bCtx.moveTo(bCanvas.width / 2 + i * 15, vanishY);
      bCtx.lineTo(bCanvas.width / 2 + i * 80, bCanvas.height);
      bCtx.stroke();
    }
    for (let y = vanishY; y < bCanvas.height; y += 25) {
      bCtx.beginPath();
      bCtx.moveTo(0, y);
      bCtx.lineTo(bCanvas.width, y);
      bCtx.stroke();
    }

    const enemyX = 290;
    const enemyY = 85;
    const enemySize = 54;

    bCtx.fillStyle = 'rgba(0,0,0,0.5)';
    bCtx.beginPath();
    bCtx.ellipse(enemyX, enemyY + enemySize / 2, enemySize * 0.6, enemySize * 0.2, 0, 0, Math.PI * 2);
    bCtx.fill();

    bCtx.fillStyle = currentEnemy ? currentEnemy.color : '#ff0055';
    bCtx.fillRect(enemyX - enemySize / 2, enemyY - enemySize / 2, enemySize, enemySize);
    bCtx.strokeStyle = '#ffffff';
    bCtx.lineWidth = 2;
    bCtx.strokeRect(enemyX - enemySize / 2, enemyY - enemySize / 2, enemySize, enemySize);

    const heroX = 110 + heroAnimOffset.x;
    const heroY = 135 + heroAnimOffset.y;
    const heroSize = 72;

    bCtx.fillStyle = 'rgba(0,0,0,0.5)';
    bCtx.beginPath();
    bCtx.ellipse(110, 135 + heroSize / 2, heroSize * 0.6, heroSize * 0.2, 0, 0, Math.PI * 2);
    bCtx.fill();

    const heroData = images['hero'];
    if (heroData && heroData.loaded && !heroData.error) {
      bCtx.save();
      bCtx.beginPath();
      bCtx.arc(heroX, heroY, heroSize / 2, 0, Math.PI * 2, true);
      bCtx.closePath();
      bCtx.clip();

      bCtx.drawImage(heroData.img, heroX - heroSize / 2, heroY - heroSize / 2, heroSize, heroSize);
      
      bCtx.strokeStyle = '#00f3ff';
      bCtx.lineWidth = 3;
      bCtx.stroke();
      bCtx.restore();
    } else {
      bCtx.fillStyle = '#00f3ff';
      bCtx.fillRect(heroX - heroSize / 2, heroY - heroSize / 2, heroSize, heroSize);
      bCtx.strokeStyle = '#ffffff';
      bCtx.lineWidth = 2;
      bCtx.strokeRect(heroX - heroSize / 2, heroY - heroSize / 2, heroSize, heroSize);
    }

    animFrameId = requestAnimationFrame(render3DBattle);
  }

  function startBattle(name, lv, hp, atk, rewardGold, rewardExp, color, x, y, isBoss = false, isFinal = false) {
    currentEnemy = { name, lv, hp, maxHp: hp, atk, rewardGold, rewardExp, color, isBoss, isFinal };
    currentEnemyPos = { x, y };
    isTurnProcessing = false;
    heroAnimOffset = { x: 0, y: 0 };

    document.getElementById('enemy-name').textContent = name;
    document.getElementById('enemy-lv').textContent = lv;
    document.getElementById('battle-msg').textContent = `${name} (Lv.${lv}) が現れた！`;
    
    updateStatusUI();
    document.getElementById('battle-overlay').style.display = 'flex';
    
    if (animFrameId) cancelAnimationFrame(animFrameId);
    render3DBattle();
  }

  function playAttackAnimation(callback) {
    let step = 0;
    const interval = setInterval(() => {
      step++;
      if (step <= 5) {
        heroAnimOffset.x += 18;
        heroAnimOffset.y -= 7;
      } else if (step <= 10) {
        heroAnimOffset.x -= 18;
        heroAnimOffset.y += 7;
      } else {
        clearInterval(interval);
        heroAnimOffset = { x: 0, y: 0 };
        callback();
      }
    }, 30);
  }

  function cmdFight() {
    if (isTurnProcessing || !currentEnemy) return;
    isTurnProcessing = true;

    playAttackAnimation(() => {
      const dmg = player.atk + Math.floor(Math.random() * 3);
      currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);

      if (checkEnemyDefeated()) return;

      const enemyDmg = Math.max(1, currentEnemy.atk + Math.floor(Math.random() * 2));
      applyDamageToPlayer(enemyDmg, `荻田の攻撃！ ${dmg} のダメージ！ 反撃で ${enemyDmg} 受けた！`);
    });
  }

  function cmdDefend() {
    if (isTurnProcessing || !currentEnemy) return;
    isTurnProcessing = true;

    const enemyDmg = Math.max(1, Math.floor((currentEnemy.atk + Math.floor(Math.random() * 2)) / 2));
    applyDamageToPlayer(enemyDmg, `荻田は身構えた！ ダメージが軽減され ${enemyDmg} 受けた！`);
  }

  function cmdItem() {
    if (isTurnProcessing || !currentEnemy) return;

    if (player.potion <= 0) {
      document.getElementById('battle-msg').textContent = "ポーションを持っていない！";
      return;
    }

    isTurnProcessing = true;
    player.potion--;
    const healVal = 20;
    player.hp = Math.min(player.maxHp, player.hp + healVal);
    updateStatusUI();

    const enemyDmg = Math.max(1, currentEnemy.atk + Math.floor(Math.random() * 2));
    applyDamageToPlayer(enemyDmg, `ポーション使用！ HPが${healVal}回復！（残り${player.potion}個） 敵の反撃で ${enemyDmg} 受けた！`);
  }

  function cmdRun() {
    if (isTurnProcessing || !currentEnemy) return;
    document.getElementById('battle-msg').textContent = "逃げ出した！";
    setTimeout(() => {
      closeBattle();
    }, 600);
  }

  function closeBattle() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    document.getElementById('battle-overlay').style.display = 'none';
    currentEnemy = null;
    drawMap();
  }

  function checkEnemyDefeated() {
    if (currentEnemy.hp <= 0) {
      document.getElementById('battle-msg').textContent = `撃破！ ${currentEnemy.rewardGold}G と ${currentEnemy.rewardExp}EXP を獲得！`;
      player.gold += currentEnemy.rewardGold;
      player.exp += currentEnemy.rewardExp;

      if (player.exp >= player.lv * 30) {
        player.lv++;
        player.maxHp += 10;
        player.hp = player.maxHp;
        player.atk += 3;
      }

      updateStatusUI();

      if (currentEnemyPos) map[currentEnemyPos.y][currentEnemyPos.x] = 0;
      if (currentEnemy.isBoss) state.hasMap = true;

      setTimeout(() => {
        if (currentEnemy.isFinal) {
          document.getElementById('dialog').innerHTML = "<span style='color:#00ff66; font-size:1.1rem;'>🎉 GAME CLEAR 🎉</span><br>かつての師匠・勝田を撃破した！";
        }
        closeBattle();
      }, 1200);
      return true;
    }
    return false;
  }

  function applyDamageToPlayer(dmg, msg) {
    player.hp = Math.max(0, player.hp - dmg);
    updateStatusUI();

    if (player.hp <= 0) {
      document.getElementById('battle-msg').textContent = "荻田は倒れてしまった…（HP全回復で復活）";
      player.hp = player.maxHp;
      updateStatusUI();
      setTimeout(() => {
        closeBattle();
      }, 1500);
    } else {
      document.getElementById('battle-msg').textContent = msg;
      isTurnProcessing = false;
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
  });

  updateStatusUI();
  drawMap();
</script>

</body>
</html>
