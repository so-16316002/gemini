<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荻田の大冒険 - 戦闘システム追加版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #05050a;
      color: #e0e0e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 480px;
      background-color: #16213e;
      border: 3px solid #0f3460;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    
    #map-canvas {
      background-color: #388e3c;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      display: block;
      margin: 0 auto 10px auto;
      image-rendering: pixelated;
    }

    /* 会話・情報メッセージ */
    #dialog {
      background-color: #0f3460;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      padding: 10px 15px;
      min-height: 80px;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    /* 戦闘画面オーバーレイ */
    #battle-overlay {
      display: none;
      position: absolute;
      top: 50px;
      left: 15px;
      right: 15px;
      height: 384px;
      background-color: #0a0a14;
      border: 3px solid #ff0055;
      border-radius: 8px;
      padding: 20px;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .enemy-display {
      text-align: center;
      margin-top: 20px;
    }
    .enemy-icon {
      width: 60px;
      height: 60px;
      background-color: #4caf50;
      margin: 0 auto 10px auto;
      border-radius: 8px;
    }
    .battle-btns {
      display: flex;
      gap: 15px;
      width: 100%;
    }
    .battle-btn {
      flex: 1;
      padding: 12px;
      background: #1f4068;
      color: #fff;
      border: 2px solid #00f3ff;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .battle-btn:active { background: #00f3ff; color: #000; }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-width: 180px;
      margin: 0 auto;
    }
    .ctrl-btn {
      background: #1f4068;
      color: #fff;
      border: 1px solid #00f3ff;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #00f3ff; color: #000; }
    .empty { visibility: hidden; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <div>荻田 Lv.<span id="player-lv">1</span> (HP: <span id="player-hp">30</span>/30)</div>
    <div>所持金: <span id="gold-val" style="color:#ffd700; font-weight:bold;">0</span> G</div>
  </div>

  <canvas id="map-canvas" width="384" height="384"></canvas>

  <!-- 戦闘画面 -->
  <div id="battle-overlay">
    <div class="enemy-display">
      <div class="enemy-icon" id="enemy-icon"></div>
      <h3 id="enemy-name" style="margin: 5px 0;">スライム</h3>
      <div>HP: <span id="enemy-hp">15</span></div>
    </div>
    <div id="battle-msg" style="text-align:center; font-size: 0.85rem; color:#ffd700;"></div>
    <div class="battle-btns">
      <button class="battle-btn" onclick="attackEnemy()">攻撃</button>
      <button class="battle-btn" onclick="runAway()">逃げる</button>
    </div>
  </div>

  <div id="dialog">【始まりの地】<br>緑の雑魚モンスターを倒してお金を稼ごう！</div>

  <div class="controls">
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, -1)">▲</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(-1, 0)">◄</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(1, 0)">►</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, 1)">▼</button>
    <div class="empty"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');
  const tileSize = 32;

  const mapWidth = 30;
  const mapHeight = 30;
  const viewGrid = 12;

  // ステータス
  const player = {
    x: 5, y: 5,
    lv: 1, hp: 30, maxHp: 30, atk: 8,
    gold: 0, exp: 0
  };

  let currentEnemy = null;
  let currentEnemyPos = null;

  const state = {
    hasMap: false,
    visitedHome: false,
    defeatedKatsuta: false
  };

  // 0:平地, 1:壁, 2:村人, 3:地図持ち中ボス, 4:思い出の品, 5:勝田, 6:雑魚モンスター
  const map = Array.from({ length: mapHeight }, (_, r) =>
    Array.from({ length: mapWidth }, (_, c) => {
      if (r === 0 || r === mapHeight - 1 || c === 0 || c === mapWidth - 1) return 1;
      return 0;
    })
  );

  // オブジェクト配置
  map[5][7] = 2;    // 村人
  map[8][10] = 3;   // 地図持ち中ボス
  map[15][15] = 4;  // 思い出の品
  map[25][25] = 5;  // 勝田

  // 雑魚モンスターを数体配置
  map[4][8] = 6;
  map[7][4] = 6;
  map[10][6] = 6;

  function updateStatusUI() {
    document.getElementById('player-lv').textContent = player.lv;
    document.getElementById('player-hp').textContent = player.hp;
    document.getElementById('gold-val').textContent = player.gold;
  }

  function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = player.x - Math.floor(viewGrid / 2);
    const offsetY = player.y - Math.floor(viewGrid / 2);

    for (let r = 0; r < viewGrid; r++) {
      for (let c = 0; c < viewGrid; c++) {
        const mapX = offsetX + c;
        const mapY = offsetY + r;
        const screenX = c * tileSize;
        const screenY = r * tileSize;

        if (mapX < 0 || mapX >= mapWidth || mapY < 0 || mapY >= mapHeight) {
          ctx.fillStyle = '#05050a';
          ctx.fillRect(screenX, screenY, tileSize, tileSize);
          continue;
        }

        const type = map[mapY][mapX];

        // 地面
        ctx.fillStyle = '#388e3c';
        ctx.fillRect(screenX, screenY, tileSize, tileSize);

        if (type === 1) {
          ctx.fillStyle = '#1b5e20';
        } else if (type === 2) {
          ctx.fillStyle = '#ffb74d'; // 村人
        } else if (type === 3) {
          ctx.fillStyle = '#e53935'; // 中ボス（赤）
        } else if (type === 4) {
          ctx.fillStyle = '#ba68c8'; // 思い出の品
        } else if (type === 5) {
          ctx.fillStyle = '#ff1744'; // 勝田
        } else if (type === 6) {
          ctx.fillStyle = '#4caf50'; // 雑魚モンスター（緑）
        }

        if (type !== 0) {
          ctx.fillRect(screenX + 4, screenY + 4, tileSize - 8, tileSize - 8);
        }
      }
    }

    // プレイヤー
    const centerPos = Math.floor(viewGrid / 2) * tileSize;
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(centerPos + 6, centerPos + 6, tileSize - 12, tileSize - 12);
  }

  function movePlayer(dx, dy) {
    if (currentEnemy) return; // 戦闘中は移動不可

    const newX = player.x + dx;
    const newY = player.y + dy;
    const target = map[newY][newX];

    if (target === 0) {
      player.x = newX;
      player.y = newY;
    } else {
      triggerEvent(target, newX, newY);
    }
    drawMap();
  }

  function triggerEvent(type, x, y) {
    const dialog = document.getElementById('dialog');

    if (type === 2) {
      dialog.innerHTML = "<strong>村人:</strong><br>「緑のモンスターを倒してお金を溜めよう。準備ができたら赤の中ボスに挑むんだ！」";
    } else if (type === 6) {
      // 雑魚モンスターとの戦闘開始
      startBattle("野良スライム", 15, 4, 20, 15, "#4caf50", x, y);
    } else if (type === 3) {
      // 中ボスとの戦闘開始
      startBattle("地図持ちガード", 40, 8, 100, 50, "#e53935", x, y, true);
    } else if (type === 4) {
      if (!state.hasMap) {
        dialog.innerHTML = "<strong>システム:</strong><br>地図がないため、まだ進めない…";
      } else {
        state.visitedHome = true;
        dialog.innerHTML = "<span style='color:#ba68c8;'>【故郷の思い出】</span><br>木刀を発見した！『勝田は最果ての地（南東）で待つ』";
      }
    } else if (type === 5) {
      if (!state.visitedHome) {
        dialog.innerHTML = "<strong>勝田:</strong><br>「故郷で己の原点を見つめ直してこい。」";
      } else {
        // ラストボス戦
        startBattle("師匠・勝田", 80, 12, 0, 200, "#ff1744", x, y, false, true);
      }
    }
  }

  // 戦闘処理
  function startBattle(name, hp, atk, rewardGold, rewardExp, color, x, y, isBoss = false, isFinal = false) {
    currentEnemy = { name, hp, maxHp: hp, atk, rewardGold, rewardExp, isBoss, isFinal };
    currentEnemyPos = { x, y };

    document.getElementById('enemy-name').textContent = name;
    document.getElementById('enemy-hp').textContent = hp;
    document.getElementById('enemy-icon').style.backgroundColor = color;
    document.getElementById('battle-msg').textContent = `${name} が現れた！`;
    document.getElementById('battle-overlay').style.display = 'flex';
  }

  function attackEnemy() {
    if (!currentEnemy) return;

    // プレイヤーの攻撃
    const dmg = player.atk + Math.floor(Math.random() * 3);
    currentEnemy.hp -= dmg;
    if (currentEnemy.hp < 0) currentEnemy.hp = 0;
    document.getElementById('enemy-hp').textContent = currentEnemy.hp;

    if (currentEnemy.hp <= 0) {
      // 勝利
      document.getElementById('battle-msg').textContent = `撃破！ ${currentEnemy.rewardGold}G と ${currentEnemy.rewardExp}EXP を獲得！`;
      player.gold += currentEnemy.rewardGold;
      player.exp += currentEnemy.rewardExp;

      // レベルアップ判定
      if (player.exp >= player.lv * 30) {
        player.lv++;
        player.maxHp += 10;
        player.hp = player.maxHp;
        player.atk += 3;
      }

      updateStatusUI();

      // マップから敵を消去
      if (currentEnemyPos) {
        map[currentEnemyPos.y][currentEnemyPos.x] = 0;
      }

      if (currentEnemy.isBoss) state.hasMap = true;

      setTimeout(() => {
        document.getElementById('battle-overlay').style.display = 'none';
        if (currentEnemy.isFinal) {
          document.getElementById('dialog').innerHTML = "<span style='color:#00ff66; font-size:1.1rem;'>🎉 GAME CLEAR 🎉</span><br>勝田を倒し、世界に平和を取り戻した！";
        }
        currentEnemy = null;
        drawMap();
      }, 1200);
      return;
    }

    // 敵の反撃
    const enemyDmg = currentEnemy.atk + Math.floor(Math.random() * 2);
    player.hp -= enemyDmg;
    if (player.hp < 0) player.hp = 0;
    updateStatusUI();

    if (player.hp <= 0) {
      document.getElementById('battle-msg').textContent = "荻田は倒れてしまった…（HP全回復で復活）";
      player.hp = player.maxHp;
      updateStatusUI();
      setTimeout(() => {
        document.getElementById('battle-overlay').style.display = 'none';
        currentEnemy = null;
      }, 1500);
    } else {
      document.getElementById('battle-msg').textContent = `荻田の攻撃！ ${dmg} のダメージ！ 反撃で ${enemyDmg} 受けた！`;
    }
  }

  function runAway() {
    document.getElementById('battle-msg').textContent = "逃げ出した！";
    setTimeout(() => {
      document.getElementById('battle-overlay').style.display = 'none';
      currentEnemy = null;
    }, 600);
  }

  updateStatusUI();
  drawMap();
</script>

</body>
</html>
