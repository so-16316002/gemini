<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荻田の大冒険 - イベントシステム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #05050a;
      color: #e0e0e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 480px;
      background-color: #16213e;
      border: 3px solid #0f3460;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    
    #map-canvas {
      background-color: #388e3c;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      display: block;
      margin: 0 auto 10px auto;
      image-rendering: pixelated;
    }

    /* 会話ウィンドウ */
    #dialog {
      background-color: #0f3460;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      padding: 10px 15px;
      min-height: 80px;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-width: 180px;
      margin: 0 auto;
    }
    .ctrl-btn {
      background: #1f4068;
      color: #fff;
      border: 1px solid #00f3ff;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #00f3ff; color: #000; }
    .empty { visibility: hidden; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <div>主人公: <strong>荻田</strong></div>
    <div>所持金: <span id="gold-val" style="color:#ffd700; font-weight:bold;">0</span> G</div>
  </div>

  <canvas id="map-canvas" width="384" height="384"></canvas>

  <div id="dialog">【始まりの地】<br>まずは近くの村人やモンスターに近づいてみよう。</div>

  <div class="controls">
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, -1)">▲</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(-1, 0)">◄</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(1, 0)">►</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, 1)">▼</button>
    <div class="empty"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');
  const tileSize = 32;

  const mapWidth = 30;
  const mapHeight = 30;
  const viewGrid = 12;

  const player = { x: 5, y: 5 };
  let gold = 0;

  // フラグ管理
  const state = {
    hasMap: false,       // 地図を持っているか
    visitedHome: false,  // 故郷の村を調べたか
    defeatedKatsuta: false // 勝田を倒したか
  };

  // 0:平地, 1:壁, 2:村人, 3:地図持ちモンスター, 4:思い出の品, 5:師匠・勝田
  const map = Array.from({ length: mapHeight }, (_, r) =>
    Array.from({ length: mapWidth }, (_, c) => {
      if (r === 0 || r === mapHeight - 1 || c === 0 || c === mapWidth - 1) return 1;
      return 0;
    })
  );

  // イベントオブジェクトの配置
  map[5][7] = 2;    // 村人（始まりの地）
  map[8][10] = 3;   // 地図を持った敵（中ボス）
  map[15][15] = 4;  // 故郷の村（思い出の品）
  map[25][25] = 5;  // 別れの地（師匠・勝田）

  function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = player.x - Math.floor(viewGrid / 2);
    const offsetY = player.y - Math.floor(viewGrid / 2);

    for (let r = 0; r < viewGrid; r++) {
      for (let c = 0; c < viewGrid; c++) {
        const mapX = offsetX + c;
        const mapY = offsetY + r;
        const screenX = c * tileSize;
        const screenY = r * tileSize;

        if (mapX < 0 || mapX >= mapWidth || mapY < 0 || mapY >= mapHeight) {
          ctx.fillStyle = '#05050a';
          ctx.fillRect(screenX, screenY, tileSize, tileSize);
          continue;
        }

        const type = map[mapY][mapX];

        // 地面
        ctx.fillStyle = '#388e3c';
        ctx.fillRect(screenX, screenY, tileSize, tileSize);

        if (type === 1) {
          ctx.fillStyle = '#1b5e20'; // 外壁
          ctx.fillRect(screenX, screenY, tileSize, tileSize);
        } else if (type === 2) {
          ctx.fillStyle = '#ffb74d'; // 村人（オレンジ）
          ctx.fillRect(screenX + 4, screenY + 4, tileSize - 8, tileSize - 8);
        } else if (type === 3) {
          ctx.fillStyle = '#e53935'; // 地図持ちモンスター（赤）
          ctx.fillRect(screenX + 4, screenY + 4, tileSize - 8, tileSize - 8);
        } else if (type === 4) {
          ctx.fillStyle = '#ba68c8'; // 思い出の品（紫）
          ctx.fillRect(screenX + 6, screenY + 6, tileSize - 12, tileSize - 12);
        } else if (type === 5) {
          ctx.fillStyle = '#ff1744'; // 勝田（濃い赤）
          ctx.fillRect(screenX + 2, screenY + 2, tileSize - 4, tileSize - 4);
        }
      }
    }

    // プレイヤー（荻田）
    const centerPos = Math.floor(viewGrid / 2) * tileSize;
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(centerPos + 6, centerPos + 6, tileSize - 12, tileSize - 12);
  }

  function movePlayer(dx, dy) {
    const newX = player.x + dx;
    const newY = player.y + dy;

    // 壁(1)以外、かつイベントキャラに重ならないように移動
    const target = map[newY][newX];
    if (target === 0) {
      player.x = newX;
      player.y = newY;
    } else {
      // キャラやオブジェクトに接触したらイベント発生
      triggerEvent(target, newX, newY);
    }
    drawMap();
  }

  function triggerEvent(type, x, y) {
    const dialog = document.getElementById('dialog');

    if (type === 2) {
      // 村人との会話
      dialog.innerHTML = "<strong>村人:</strong><br>「東に強い魔物がいるらしい。地図を持っていれば故郷の村へ行けるのだが…」";
    } else if (type === 3) {
      // 地図持ちモンスター
      state.hasMap = true;
      map[y][x] = 0; // 倒して消滅
      gold += 100;
      document.getElementById('gold-val').textContent = gold;
      dialog.innerHTML = "<span style='color:#ffd700;'>【強敵撃破！】</span><br>100Gと『故郷への地図』を入手した！南東の故郷の村へ進めるようになった。";
    } else if (type === 4) {
      // 故郷の村（思い出の品）
      if (!state.hasMap) {
        dialog.innerHTML = "<strong>システム:</strong><br>地図がないため、まだ進めない…";
      } else {
        state.visitedHome = true;
        dialog.innerHTML = "<span style='color:#ba68c8;'>【故郷の思い出】</span><br>かつて師匠・勝田と修行した木刀を発見した…『勝田は最果ての地で待つ』と刻まれている！";
      }
    } else if (type === 5) {
      // 勝田（ラストボス）
      if (!state.visitedHome) {
        dialog.innerHTML = "<strong>勝田:</strong><br>「まだ来るときではない…故郷で己の原点を見つめ直してこい。」";
      } else {
        state.defeatedKatsuta = true;
        map[y][x] = 0;
        dialog.innerHTML = "<span style='color:#00ff66; font-size:1.1rem;'>🎉 GAME CLEAR 🎉</span><br>かつての師匠・勝田との死闘を制した！荻田の旅は幕を閉じた。";
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
  });

  drawMap();
</script>

</body>
</html>
