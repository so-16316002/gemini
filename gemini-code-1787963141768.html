<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荻田の大冒険</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #05050a;
      color: #e0e0e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* タイトル画面 */
    #title-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }
    .title-logo {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff007f, 0 0 30px #ff007f;
      margin-bottom: 40px;
      animation: dropDown 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dropDown {
      0% { transform: translateY(-200px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .press-start {
      font-size: 1.2rem;
      color: #00f3ff;
      text-shadow: 0 0 8px #00f3ff;
      margin-bottom: 30px;
      letter-spacing: 2px;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .btn-neon {
      background: transparent;
      color: #00ff66;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 40px;
      border: 2px solid #00ff66;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff66, inset 0 0 10px #00ff66;
      text-shadow: 0 0 5px #00ff66;
      transition: all 0.2s ease;
    }
    .btn-neon:hover {
      background: #00ff66;
      color: #05050a;
      box-shadow: 0 0 20px #00ff66, inset 0 0 20px #00ff66;
    }

    /* ゲーム本編 */
    #game-container {
      display: none;
      width: 100%;
      max-width: 600px;
      background-color: #16213e;
      border: 3px solid #0f3460;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #0f3460;
      padding-bottom: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .status-val { font-weight: bold; color: #e94560; }
    
    /* マップ表示エリア */
    #map-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }
    .map-cell {
      background-color: #0f3460;
      border: 1px solid #1f4068;
      border-radius: 6px;
      padding: 10px 5px;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
    }
    .map-cell.active {
      background-color: #e94560;
      color: #fff;
      font-weight: bold;
      border-color: #ff6b81;
      box-shadow: 0 0 8px #e94560;
    }
    .map-cell.cleared {
      color: #00ff66;
    }

    #screen {
      background-color: #0f3460;
      border-radius: 8px;
      padding: 15px;
      min-height: 100px;
      margin-bottom: 15px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .game-btn {
      background-color: #1f4068;
      color: #fff;
      border: 1px solid #00f3ff;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .game-btn:hover { background-color: #00f3ff; color: #000; }
    .game-btn.action-btn {
      background-color: #e94560;
      border-color: #ff6b81;
      grid-column: span 2;
    }
    .game-btn.action-btn:hover { background-color: #ff6b81; color: #fff; }
  </style>
</head>
<body>

<!-- タイトル画面 -->
<div id="title-screen">
  <div class="title-logo">荻田の大冒険</div>
  <div class="press-start">- PRESS START -</div>
  <button class="btn-neon" id="start-btn">最初から</button>
</div>

<!-- 本編画面 -->
<div id="game-container">
  <div class="header">
    <div>荻田 HP: <span id="hp" class="status-val">100</span></div>
    <div>達成ミッション: <span id="mission-count" style="color:#00ff66; font-weight:bold;">0</span> / 3</div>
  </div>

  <!-- 3x3のマップを表示 -->
  <div id="map-grid">
    <div class="map-cell" id="cell-0">公園</div>
    <div class="map-cell" id="cell-1">コンビニ</div>
    <div class="map-cell" id="cell-2">怪しいビル</div>
    <div class="map-cell" id="cell-3">商店街</div>
    <div class="map-cell active" id="cell-4">自宅前 (現在地)</div>
    <div class="map-cell" id="cell-5">駅前</div>
    <div class="map-cell" id="cell-6">川原</div>
    <div class="map-cell" id="cell-7">裏路地</div>
    <div class="map-cell" id="cell-8">廃校</div>
  </div>

  <div id="screen">読み込み中...</div>
  <div id="choices" class="choices-grid"></div>
</div>

<script>
  let audioCtx = null;
  let bgmInterval = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playSe() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  function startBgm() {
    if (bgmInterval) return;
    initAudio();
    const notes = [261.63, 329.63, 392.00, 523.25];
    let step = 0;
    bgmInterval = setInterval(() => {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
      step++;
    }, 300);
  }

  window.addEventListener('click', () => { startBgm(); }, { once: true });

  // マップデータ（3x3グリッド）
  const mapData = [
    { name: "公園", desc: "ミッション1：【失くした鍵を探せ】<br>ベンチの近くを探索しよう。", hasMission: true, cleared: false },
    { name: "コンビニ", desc: "エナジードリンクを買って休憩できる。(HP全回復)", hasMission: false },
    { name: "怪しいビル", desc: "ミッション2：【謎の暗号を解け】<br>壁に何か書かれている…", hasMission: true, cleared: false },
    { name: "商店街", desc: "活気のある商店街。人々が行き交っている。", hasMission: false },
    { name: "自宅前", desc: "スタート地点。冒険の準備は整った。", hasMission: false },
    { name: "駅前", desc: "人がたくさんいる。特に怪しいものはない。", hasMission: false },
    { name: "川原", desc: "風が気持ちいい。リフレッシュできる。", hasMission: false },
    { name: "裏路地", desc: "ミッション3：【野良猫ボスを説得せよ】<br>ボス猫が通せんぼしている！", hasMission: true, cleared: false },
    { name: "廃校", desc: "【最終目的地】全てのミッションをクリアすると入れるようだ…", hasMission: false }
  ];

  const state = {
    pos: 4, // スタートは中央 (自宅前)
    hp: 100,
    maxHp: 100,
    clearedMissions: 0
  };

  function updateMapUI() {
    for (let i = 0; i < 9; i++) {
      const cell = document.getElementById(`cell-${i}`);
      cell.className = "map-cell";
      
      let label = mapData[i].name;
      if (mapData[i].cleared) {
        cell.classList.add("cleared");
        label += " (済)";
      }
      if (i === state.pos) {
        cell.classList.add("active");
        label += " ★";
      }
      cell.innerHTML = label;
    }
    document.getElementById('hp').textContent = state.hp;
    document.getElementById('mission-count').textContent = state.clearedMissions;
  }

  function renderLocation() {
    updateMapUI();
    const current = mapData[state.pos];
    let html = `【${current.name}】<br>${current.desc}`;

    const choices = [];

    // 現在地のミッション処理ボタン
    if (current.hasMission && !current.cleared) {
      choices.push({ text: "⚡ ミッションに挑戦する", action: doMission, isAction: true });
    } else if (state.pos === 1) {
      choices.push({ text: "🍷 ドリンクを飲んで回復", action: () => {
        state.hp = state.maxHp;
        renderText("HPが全回復した！");
      }, isAction: true });
    } else if (state.pos === 8) {
      if (state.clearedMissions >= 3) {
        choices.push({ text: "👑 廃校に入る（ラストクリア）", action: gameClear, isAction: true });
      } else {
        html += "<br><span style='color:#e94560;'>（鍵がかかっている。他の場所で3つのミッションをクリアしよう）</span>";
      }
    }

    // 移動ボタン（上下左右）
    const x = state.pos % 3;
    const y = Math.floor(state.pos / 3);

    if (y > 0) choices.push({ text: "⬆ 北へ移動", action: () => move(state.pos - 3) });
    if (y < 2) choices.push({ text: "⬇ 南へ移動", action: () => move(state.pos + 3) });
    if (x > 0) choices.push({ text: "⬅ 西へ移動", action: () => move(state.pos - 1) });
    if (x < 2) choices.push({ text: "➡ 東へ移動", action: () => move(state.pos + 1) });

    showChoices(html, choices);
  }

  function move(newPos) {
    state.pos = newPos;
    renderLocation();
  }

  function showChoices(text, choices) {
    document.getElementById('screen').innerHTML = text;
    const container = document.getElementById('choices');
    container.innerHTML = '';

    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = c.isAction ? 'game-btn action-btn' : 'game-btn';
      btn.textContent = c.text;
      btn.onclick = () => {
        playSe();
        c.action();
      };
      container.appendChild(btn);
    });
  }

  function renderText(msg) {
    showChoices(msg, [{ text: "戻る", action: renderLocation }]);
  }

  // ミッション実行処理
  function doMission() {
    const current = mapData[state.pos];
    current.cleared = true;
    state.clearedMissions++;

    let msg = "";
    if (state.pos === 0) msg = "荻田は草むらから【落とし物の鍵】を見つけ出した！ミッション達成！";
    else if (state.pos === 2) msg = "壁の暗号『OGITA』を読み解いた！ミッション達成！";
    else if (state.pos === 7) msg = "ボス猫にお菓子をあげて仲良くなった！ミッション達成！";

    renderText(`【ミッションクリア！】<br>${msg}`);
  }

  // ゲームクリア
  function gameClear() {
    showChoices(
      "【エンディング】<br>すべてのミッションを達成し、荻田は街の平和を守り抜いた！<br>🎉 GAME CLEAR 🎉",
      [{ text: "タイトルに戻る", action: () => location.reload() }]
    );
  }

  // スタート処理
  document.getElementById('start-btn').addEventListener('click', () => {
    playSe();
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    renderLocation();
  });
</script>

</body>
</html>
